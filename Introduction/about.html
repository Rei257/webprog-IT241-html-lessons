<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JC Guzman - About Me</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar">
    <a href="index.html" class="nav-btn">Home</a>
    <a href="about.html" class="nav-btn">About Me</a>
  </nav>

  <!-- Kuromi corners -->
  <img class="kuromi-corner top-left" src="undefined - Imgur.png" alt="Kuromi">
  <img class="kuromi-corner top-right" src="undefined - Imgur.png" alt="Kuromi">
  <img class="kuromi-corner bottom-left" src="undefined - Imgur.gif" alt="Kuromi">
  <img class="kuromi-corner bottom-right" src="undefined - Imgur.gif" alt="Kuromi">

  <!-- Main content -->
  <main class="grid-container">
    <div id="about" class="custom-box interactive" data-kuromi="true">
      <h3>About Me</h3>
      <p>Calm, quiet. I enjoy watching movies and anime. Passionate about web programming and creative projects.</p>
    </div>
  </main>

  <footer class="footer">
    <p>© 2026 APC Web Programming</p>
  </footer>

  <script>
    // Kuromi hover logic
    const boxes = document.querySelectorAll('.custom-box[data-kuromi]');
    const kuromis = document.querySelectorAll('.kuromi-corner');

    boxes.forEach(box => {
      box.addEventListener('mouseenter', () => {
        kuromis.forEach(k => k.style.opacity = '1');
      });
      box.addEventListener('mouseleave', () => {
        kuromis.forEach(k => k.style.opacity = '0');
      });
    });
  </script>

</body>
</html>
