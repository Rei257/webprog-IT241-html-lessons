<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JC Guzman - Home</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar">
    <a href="index.html" class="nav-btn">Home</a>
    <a href="about.html" class="nav-btn">About Me</a>
  </nav>

  <!-- Landing profile -->
  <section class="landing">
    <img id="profile-pic" src="jc (2).jpg" alt="Profile Picture">
    <h2>John Carl Gabriel Guzman</h2>
    <p class="subtitle">BSIT • Web Programming (IT241)</p>
  </section>

  <!-- Modal zoom -->
  <div id="modal" class="modal">
    <span id="close-modal" class="close">&times;</span>
    <img id="modal-img" src="jc (2).jpg" alt="Profile Picture Zoomed">
  </div>

  <footer class="footer">
    <p>© 2026 APC Web Programming</p>
  </footer>

  <script>
    const profilePic = document.getElementById('profile-pic');
    const modal = document.getElementById('modal');
    const closeModal = document.getElementById('close-modal');

    profilePic.addEventListener('click', () => {
      modal.style.display = 'flex';
    });

    closeModal.addEventListener('click', () => {
      modal.style.display = 'none';
    });

    modal.addEventListener('click', (e) => {
      if (e.target === modal) modal.style.display = 'none';
    });
  </script>

</body>
</html>
