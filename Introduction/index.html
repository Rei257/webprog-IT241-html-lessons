<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JC Guzman - Home</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- Navigation -->
  <nav class="navbar">
    <a href="index.html" class="nav-btn">Home</a>
    <a href="about.html" class="nav-btn">About Me</a>
  </nav>

  <!-- Left Photo Booth -->
  <div class="photo-booth left">
    <img v-for="(img, i) in boothImages" :key="'left'+i" :src="img" class="booth-img" @click="openZoom(img)">
  </div>

  <!-- Right Photo Booth -->
  <div class="photo-booth right">
    <img v-for="(img, i) in boothImages" :key="'right'+i" :src="img" class="booth-img" @click="openZoom(img)">
  </div>

  <!-- Landing profile -->
  <section class="landing">
    <img id="profile-pic" src="jc (2).jpg" alt="Profile Picture" @click="openZoom('jc (2).jpg')">
    <h2>John Carl Gabriel Guzman</h2>
    <p class="subtitle">BSIT • Web Programming (IT241)</p>
  </section>

  <!-- Modal zoom -->
  <div v-if="zoomImage" class="modal" @click.self="zoomImage = null">
    <span class="close" @click="zoomImage = null">&times;</span>
    <img :src="zoomImage" alt="Zoomed Image">
  </div>

  <footer class="footer">
    <p>© 2026 APC Web Programming</p>
  </footer>
</div>

<!-- Vue.js -->
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script>
const { createApp, ref } = Vue;

createApp({
  setup() {
    const boothImages = [
      "jc2.jpg",     // replace with actual filename
      "Family.jpg",
      "Gala.jpg",
      "Friends.jpg"
    ];
    const zoomImage = ref(null);

    const openZoom = (img) => {
      zoomImage.value = img;
    };

    return { boothImages, zoomImage, openZoom };
  }
}).mount("#app");
</script>
</body>
</html>
