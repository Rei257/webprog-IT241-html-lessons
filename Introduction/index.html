<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JC Guzman - Home</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- Navigation -->
  <nav class="navbar">
    <a href="index.html" class="nav-btn">Home</a>
    <a href="about.html" class="nav-btn">About Me</a>
  </nav>

  <!-- Side Images -->
  <img class="side-image side-left" src="JC.jpg" alt="Left Decoration" @click="openZoom('left')">
  <img class="side-image side-right" src="Jotaro.jpg" alt="Right Decoration" @click="openZoom('right')">

  <!-- Landing profile -->
  <section class="landing">
    <img id="profile-pic" src="jc (2).jpg" alt="Profile Picture" @click="openZoom('profile')">
    <h2>John Carl Gabriel Guzman</h2>
    <p class="subtitle">BSIT • Web Programming (IT241)</p>
  </section>

  <!-- Modal zoom -->
  <div v-if="zoomTarget" class="modal" @click.self="zoomTarget = null">
    <span class="close" @click="zoomTarget = null">&times;</span>
    <img :src="getZoomImage()" alt="Zoomed Image">
  </div>

  <footer class="footer">
    <p>© 2026 APC Web Programming</p>
  </footer>
</div>

<!-- Vue.js and Hammer.js -->
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="https://hammerjs.github.io/dist/hammer.min.js"></script>
<script>
const { createApp, ref, onMounted } = Vue;

createApp({
  setup() {
    const zoomTarget = ref(null);

    const openZoom = (target) => {
      zoomTarget.value = target;
    };

    const getZoomImage = () => {
      if (zoomTarget.value === 'left') return 'JC.jpg';
      if (zoomTarget.value === 'right') return 'Jotaro.jpg';
      return 'jc (2).jpg';
    };

    onMounted(() => {
      const modal = document.querySelector('.modal');
      if (modal) {
        const hammer = new Hammer(modal);
        hammer.on("swipeleft swiperight", () => {
          if (zoomTarget.value === 'left') zoomTarget.value = 'right';
          else if (zoomTarget.value === 'right') zoomTarget.value = 'left';
        });
      }
    });

    return {
      zoomTarget,
      openZoom,
      getZoomImage
    };
  }
}).mount("#app");
</script>
</body>
</html>
