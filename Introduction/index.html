<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JC Guzman - Home</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <!-- Navigation -->
  <nav class="navbar">
    <a href="index.html" class="nav-btn">Home</a>
    <a href="about.html" class="nav-btn">About Me</a>
  </nav>

  <!-- Landing profile -->
  <section class="landing">
    <img id="profile-pic" src="jc (2).jpg" alt="Profile Picture" @click="showModal = true">
    <h2>{{ name }}</h2>
    <p class="subtitle">{{ subtitle }}</p>
  </section>

  <!-- Modal zoom -->
  <div v-if="showModal" class="modal" @click.self="showModal = false">
    <span class="close" @click="showModal = false">&times;</span>
    <img id="modal-img" src="jc (2).jpg" alt="Profile Picture Zoomed">
  </div>

  <footer class="footer">
    <p>© 2026 APC Web Programming</p>
  </footer>
</div>

<!-- Vue.js -->
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script>
const { createApp } = Vue;

createApp({
  data() {
    return {
      name: "John Carl Gabriel Guzman",
      subtitle: "BSIT • Web Programming (IT241)",
      showModal: false
    };
  }
}).mount("#app");
</script>
</body>
</html>
